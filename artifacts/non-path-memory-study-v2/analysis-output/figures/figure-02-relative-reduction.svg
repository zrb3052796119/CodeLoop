<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img">
<title>Family-cluster efficiency effects</title>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}</style>
<text x="250" y="36" font-size="24" font-weight="700">Efficiency effects across 12 task families</text>
<text x="250" y="62" font-size="14">Point estimate and 95% family-cluster bootstrap interval; positive favors Memory.</text>
<line x1="250.0" y1="95" x2="250.0" y2="435" stroke="#ECECEC"/>
<text x="250.0" y="458" font-size="12" text-anchor="middle">-10%</text>
<line x1="376.7" y1="95" x2="376.7" y2="435" stroke="#ECECEC"/>
<text x="376.7" y="458" font-size="12" text-anchor="middle">10%</text>
<line x1="503.3" y1="95" x2="503.3" y2="435" stroke="#ECECEC"/>
<text x="503.3" y="458" font-size="12" text-anchor="middle">30%</text>
<line x1="630.0" y1="95" x2="630.0" y2="435" stroke="#ECECEC"/>
<text x="630.0" y="458" font-size="12" text-anchor="middle">50%</text>
<line x1="756.7" y1="95" x2="756.7" y2="435" stroke="#ECECEC"/>
<text x="756.7" y="458" font-size="12" text-anchor="middle">70%</text>
<line x1="883.3" y1="95" x2="883.3" y2="435" stroke="#ECECEC"/>
<text x="883.3" y="458" font-size="12" text-anchor="middle">90%</text>
<line x1="1010.0" y1="95" x2="1010.0" y2="435" stroke="#ECECEC"/>
<text x="1010.0" y="458" font-size="12" text-anchor="middle">110%</text>
<text x="237" y="142.5" font-size="13" text-anchor="end">Repository tool calls</text>
<line x1="411.5" y1="137.5" x2="632.8" y2="137.5" stroke="#0072B2" stroke-width="4"/>
<circle cx="533.6" cy="137.5" r="7" fill="#0072B2"/>
<text x="640.8" y="142.5" font-size="11">34.8% [15.5, 50.4]</text>
<text x="237" y="227.5" font-size="13" text-anchor="end">Task input tokens</text>
<line x1="359.2" y1="222.5" x2="695.0" y2="222.5" stroke="#0072B2" stroke-width="4"/>
<circle cx="566.1" cy="222.5" r="7" fill="#0072B2"/>
<text x="703.0" y="227.5" font-size="11">39.9% [7.2, 60.3]</text>
<text x="237" y="312.5" font-size="13" text-anchor="end">Task model calls</text>
<line x1="367.2" y1="307.5" x2="604.4" y2="307.5" stroke="#0072B2" stroke-width="4"/>
<circle cx="500.3" cy="307.5" r="7" fill="#0072B2"/>
<text x="612.4" y="312.5" font-size="11">29.5% [8.5, 46.0]</text>
<text x="237" y="397.5" font-size="13" text-anchor="end">Tool failures</text>
<line x1="340.3" y1="392.5" x2="885.9" y2="392.5" stroke="#0072B2" stroke-width="4"/>
<circle cx="728.3" cy="392.5" r="7" fill="#0072B2"/>
<text x="893.9" y="397.5" font-size="11">65.5% [4.3, 90.4]</text>
</svg>
