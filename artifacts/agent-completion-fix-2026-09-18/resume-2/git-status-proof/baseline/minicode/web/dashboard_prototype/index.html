<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" />
    <title>MiniCode · Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">跳到主要内容</a>

    <nav id="nav" aria-label="主导航">
      <div class="brand">
        MiniCode <span class="brand-mark">⌁</span>
        <small>anthropic · sonnet-4</small>
        <button id="nav-toggle" title="收起侧栏" aria-label="收起侧栏">❮</button>
      </div>
      <div class="nav-group">System</div>
      <a href="#overview" data-view="overview">概览</a>
      <a href="#runs" data-view="runs">运行 <span class="nav-count">5</span></a>
      <a href="#sessions" data-view="sessions">会话 <span class="nav-count">6</span></a>
      <a href="#memory" data-view="memory">记忆 <span class="nav-count">5</span></a>
      <a href="#skills" data-view="skills">技能 <span class="nav-count">8</span></a>
      <a href="#connections" data-view="connections">连接 <span class="nav-count">5</span></a>
      <a href="#ops" data-view="ops">运维 <span class="nav-count warn">!</span></a>
      <a href="#system" data-view="system">系统</a>
      <div class="nav-foot">只读原型 · 模拟数据</div>
    </nav>

    <div class="resizer" id="nav-resizer" title="拖动调整侧栏"></div>

    <main>
      <header class="pagehead">
        <h1 id="title">概览</h1>
        <div class="page-meta" id="page-meta"></div>
      </header>
      <div id="view" tabindex="-1"></div>
    </main>

    <div class="resizer" id="dock-resizer" title="拖动调整会话栏"></div>

    <aside id="dock" aria-label="MiniCode 会话">
      <div class="dock-head">
        <span>会话</span>
        <small id="dock-status">run-7F3A · active</small>
        <button id="dock-close" title="收起会话栏" aria-label="收起会话栏">›</button>
      </div>
      <div class="session-actions">
        <button id="new-chat">＋ 新会话</button>
        <button id="history-toggle">历史 ▾</button>
      </div>
      <div id="session-menu" class="session-menu" hidden></div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-bar" id="chat-form">
        <input id="message" autocomplete="off" placeholder="给 MiniCode 一个任务…" aria-label="给 MiniCode 一个任务" />
        <button type="submit">发送</button>
      </form>
    </aside>

    <button id="nav-reopen" title="显示侧栏" aria-label="显示侧栏">☰</button>
    <button id="dock-reopen">‹ 会话</button>
    <div id="toast" class="toast" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
