name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os == 'windows-latest' && 'Experimental package checks' || 'Full runtime' }} / Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q minicode tests

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          python -m ruff check minicode/ --select=E,F --ignore=E501

      - name: Restore pinned test and replay inputs
        run: python scripts/restore_archived_artifacts.py --manifest artifacts/archives/governance-pinned-inputs-2026-10-24/manifest.json --restore

      - name: Run deterministic agent quality gate
        run: python scripts/evaluate_agent_quality.py --profile current

      - name: Check portfolio documentation links
        run: python -m pytest tests/test_portfolio_document_links.py -q

      - name: Run packaging smoke tests
        run: python -m pytest tests/test_packaging.py -q

      - name: Verify committed archive package
        run: python scripts/check_clean_archive_package.py

      - name: Run test suite
        if: runner.os != 'Windows'
        # Changes per CI run, remains identical across its OS/Python matrix and
        # retries, and is printed by pytest-randomly for exact reproduction.
        env:
          PYTEST_RANDOMLY_SEED: ${{ github.run_number }}
        run: python -m pytest -ra --randomly-seed=${{ env.PYTEST_RANDOMLY_SEED }} --junitxml=pytest-results.xml

      - name: State experimental Windows scope
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'This job checks installation, compile/lint, offline quality, packaging, entry-point imports and the committed archive. It does not accept the full native Windows runtime.' >> $env:GITHUB_STEP_SUMMARY
          'The separate Windows runtime diagnostics workflow runs the complete unfiltered suite and keeps failures visible. See docs/platform-support.md.' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}-seed-${{ github.run_number }}
          path: pytest-results.xml
          if-no-files-found: ignore
